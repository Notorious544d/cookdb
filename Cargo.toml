[package]
name = "cookdb"
version = "0.1.1"
edition = "2024"

[features]
default = ["nutrition"]
nutrition = ["dep:cooklang-ingredients"]

[workspace]
members = ["crates/cookdb-wasm"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
cooklang = { version = "0.19.0", default-features = false, features = ["aisle", "bundled_units"] }
cooklang-format = "0.39.0"
cooklang-ingredients = { git = "https://github.com/Notorious544d/cooklang-ingredients", branch = "main", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
