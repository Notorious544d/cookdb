[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"

[workspace.dependencies]
cookdb-core = { path = "crates/core" }
cookdb-db = { path = "crates/db" }
cooklang = { version = "0.19.0", default-features = false, features = ["aisle", "bundled_units"] }
cooklang-format = "0.39.0"
serde_json = "1"

[package]
name = "cookdb"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive", "env"] }
cookdb-core = { workspace = true }
cookdb-db = { workspace = true }
cooklang = { workspace = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = { workspace = true }