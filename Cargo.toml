[package]
name = "cookdb"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.12"
anyhow = "1.0.104"
cooklang = { version = "0.19.0", default-features = false, features = ["aisle", "bundled_units"] }
indexmap = { version = "2.14.2", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
