<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recipes</title>
    <link rel="stylesheet" href="css/output.css">
    <link rel="manifest" href="site.webmanifest">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <style>
      .viewport {
        width: 100%;
        max-width: 72rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
    </style>
</head>
<body class="bg-bg text-text">
    <div class="viewport">
        <main>
            <div id="site-header"></div>
            <header class="mb-8">
                <h1 id="recipe-count" class="text-display font-bold"></h1>
            </header>
            <div class="flex items-center gap-2 mb-6">
                <label for="sort-field" class="text-sm text-muted">Sort by:</label>
                <select id="sort-field" class="select">
                    <option value="name">Name</option>
                    <option value="cuisine">Cuisine</option>
                </select>
                <button id="sort-dir" type="button" class="btn"
                        aria-label="Toggle sort direction" title="Toggle sort direction">↑</button>
            </div>
            <div id="recipe-list" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </main>
    </div>
    <script src="js/keyboard-shortcuts.js"></script>
    <script src="js/sql-wasm.js"></script>
    <script type="module" src="js/index.js"></script>
</body>
</html>
