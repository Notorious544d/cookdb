<!doctype html>
<html lang="en"><head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe</title>
    <link rel="stylesheet" href="css/output.css">
    <link rel="manifest" href="site.webmanifest">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <style>
        .viewport{width:100%;max-width:72rem;margin:2rem auto;padding:0 1rem}
        .nutrition-table{width:100%;border-collapse:collapse;font-size:var(--text-meta)}
        .nutrition-table th,.nutrition-table td{padding:.55rem 0;border-bottom:1px solid var(--border)}
        .nutrition-table th{color:var(--text-muted);font-weight:500;text-align:left}
        .nutrition-table td{text-align:right;font-variant-numeric:tabular-nums}
        .nutrition-table tr:last-child th,.nutrition-table tr:last-child td{border-bottom:0}
        .nutrition-product-row{display:flex;align-items:center;justify-content:space-between;gap:.75rem;font-size:var(--text-meta);color:var(--text-muted)}
        .nutrition-product-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .nutrition-product-select{max-width:60%;padding:.35rem .5rem;border:1px solid var(--border-strong);border-radius:var(--radius-control);background:var(--surface);color:var(--text)}
        #search-results a.search-selected {
            background: var(--accent-soft);
            box-shadow: inset 3px 0 0 var(--accent);
        }
    </style>
</head><body class="bg-bg text-text"><div class="viewport">
    <div id="site-header"></div>
    <nav class="mb-4 breadcrumb print:hidden" aria-label="Breadcrumb">
        <ol class="flex items-center space-x-2 text-sm text-muted">
            <li><a href="index.html" class="hover:text-text">Recipes</a></li>
            <li class="flex items-center">
                <span class="mx-2 text-faint">/</span>
                <span id="breadcrumb-title" class="text-text"></span>
            </li>
        </ol>
    </nav>
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
        <h1 id="title" class="text-display font-bold text-text"></h1>
        <div class="flex flex-wrap items-center gap-2 lg:gap-3">
            <div class="flex items-center gap-2">
                <label for="scale" class="text-sm font-medium text-muted">Scale:</label>
                <div class="stepper">
                    <button id="minus" type="button" aria-label="Decrease scale">&minus;</button>
                    <input id="scale" type="number" min="0.5" max="200" step="any">
                    <button id="plus" type="button" aria-label="Increase scale">+</button>
                </div>
            </div>
            <button id="start-cooking-btn" type="button" class="btn btn-primary" onclick="startCookingMode()" title="Start Cooking">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span>Cook</span>
            </button>
        </div>
    </div>
    <div class="space-y-4 mb-8">
        <div id="tags" class="flex flex-wrap gap-2"></div>
        <div id="cuisine" class="flex flex-wrap gap-3"></div>
    </div>
    <div class="grid md:grid-cols-3 xl:grid-cols-4 gap-8 mb-8">
        <div class="md:col-span-1 space-y-4">
            <div class="card p-6">
                <h2 class="text-title font-bold mb-4 text-accent-text">🥘 Ingredients</h2>
                <ul id="ingredients" class="ingredient-list space-y-3"></ul>
            </div>
            <aside>
                <div class="card p-6">
                    <div class="flex items-center justify-between gap-3 mb-4">
                        <h2 class="text-title font-bold text-accent-text">🥗 Nutrition</h2>
                        <select id="nutrition-basis"
                                class="nutrition-product-select"
                                aria-label="Show nutrition values">
                            <option value="serving">Per serving</option>
                            <option value="100g">Per 100 g</option>
                        </select>
                    </div>

                    <div id="nutrition-products" class="space-y-2 mb-4"></div>
                    <p id="nutrition-status" class="text-sm text-muted hidden" role="status"></p>
                    <table id="nutrition-table" class="nutrition-table hidden" aria-label="Recipe nutrition">
                        <tbody id="nutrition-values"></tbody>
                    </table>
                </div>
            </aside>
        </div>
        <div class="md:col-span-2 xl:col-span-2">
            <div class="card p-6">
                <ol id="steps" class="step-list space-y-4"></ol>
            </div>
        </div>
    </div>
</div>
<script src="js/keyboard-shortcuts.js"></script>
<script src="js/sql-wasm.js"></script>
<script type="module" src="js/recipe.js"></script>
</body></html>
